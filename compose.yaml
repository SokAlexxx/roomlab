services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: roomlab
      POSTGRES_USER: roomlab
      POSTGRES_PASSWORD: ${PG_PASS:?set PG_PASS}
    volumes: [data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomlab -d roomlab"]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    build: .
    environment:
      PG_PASS: ${PG_PASS:?set PG_PASS}
      DEMO_PASS: ${DEMO_PASS:?set DEMO_PASS}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:${WEB_PORT:-8000}:8000"]
volumes:
  data:
